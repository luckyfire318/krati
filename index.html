<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krati — Offline Profile Studio</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#171717;--muted:#737373;--line:#dbdbdb;--accent:#0095f6;--danger:#ed4956;--shadow:0 8px 30px #00000012}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1100px)/2))}.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.top-actions{display:flex;gap:8px}.btn{padding:9px 14px;border-radius:9px;background:#efefef;font-weight:700}.btn.primary{background:var(--text);color:#fff}.btn.blue{background:var(--accent);color:#fff}.btn.danger{background:#feecee;color:var(--danger)}main{max-width:1100px;margin:auto;padding:22px 16px 80px}.profile{display:grid;grid-template-columns:220px 1fr;gap:34px;padding:18px 0 28px}.avatar-wrap{display:flex;justify-content:center}.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#eee;border:1px solid var(--line)}.profile-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.username{font-size:24px;font-weight:500}.name{font-weight:700;margin-top:8px}.bio{white-space:pre-wrap;margin-top:6px;line-height:1.45}.stats{display:flex;gap:28px;margin:18px 0;font-size:15px}.stats b{font-weight:700}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{background:#efefef;border-radius:999px;padding:6px 10px;font-size:13px}.highlights{display:flex;gap:20px;overflow:auto;padding:4px 0 24px}.highlight{text-align:center;min-width:76px}.highlight img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#eee}.highlight span{display:block;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{border-top:1px solid var(--line);display:flex;justify-content:center;gap:70px;height:52px;align-items:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.5px}.tabs .active{color:var(--text)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.post-tile{aspect-ratio:1;position:relative;background:#eee;overflow:hidden}.post-tile img{width:100%;height:100%;object-fit:cover}.post-tile .tile-info{position:absolute;inset:auto 0 0 0;padding:8px;color:#fff;background:linear-gradient(transparent,#0008);font-size:12px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.panel{position:fixed;inset:0;z-index:50;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.panel.open{display:flex}.modal{background:var(--card);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:var(--shadow);padding:22px}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--text)}textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.editor-section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.list-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;gap:10px}.list-row img{width:42px;height:42px;object-fit:cover;border-radius:8px}.row-main{display:flex;align-items:center;gap:10px;min-width:0}.row-text{overflow:hidden}.row-text b,.row-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-text span{font-size:12px;color:var(--muted)}.post-view{padding:0;overflow:hidden}.post-view img{width:100%;max-height:70vh;object-fit:contain;background:#111;display:block}.post-copy{padding:16px}.post-copy h3{margin:0 0 7px}.post-copy p{white-space:pre-wrap;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.notice{padding:10px 12px;background:#f5f5f5;border-radius:10px;font-size:13px;color:var(--muted);margin-bottom:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.file{display:none}@media(max-width:700px){.profile{grid-template-columns:90px 1fr;gap:18px}.avatar{width:86px;height:86px}.username{font-size:20px}.stats{gap:15px;font-size:13px}.tabs{gap:35px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding:0 10px}.top-actions .btn{padding:8px 9px;font-size:12px}.brand{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">krati</div><div class="top-actions"><button class="btn" id="editBtn">Edit</button><button class="btn" id="exportBtn">Export</button><button class="btn" id="importBtn">Import</button><button class="btn blue" id="addPostBtn">+ Post</button><input id="importFile" class="file" type="file" accept=".json,application/json"></div></header>
<main>
<section class="profile"><div class="avatar-wrap"><img id="avatar" class="avatar" alt="Profile picture"></div><div><div class="profile-head"><div id="username" class="username">username</div><button class="btn" id="profileEditBtn">Edit profile</button></div><div id="name" class="name">Your Name</div><div id="bio" class="bio">Your bio</div><div id="tags" class="tags"></div><div class="stats"><span><b id="postsCount">0</b> posts</span><span><b id="followers">0</b> followers</span><span><b id="following">0</b> following</span></div></div></section>
<section><div id="highlights" class="highlights"></div></section>
<div class="tabs"><div class="active">▦ POSTS</div><div>♡ LIKES</div><div>▣ SAVED</div></div>
<section id="grid" class="grid"></section>
</main>
</div>
<div id="editorPanel" class="panel"><div class="modal"><h2>Edit profile</h2><div class="form-grid"><div class="field"><label>Username</label><input id="fUsername"></div><div class="field"><label>Name</label><input id="fName"></div><div class="field full"><label>Bio</label><textarea id="fBio"></textarea></div><div class="field"><label>Followers</label><input id="fFollowers" type="number" min="0"></div><div class="field"><label>Following</label><input id="fFollowing" type="number" min="0"></div><div class="field full"><label>Profile tags (comma separated)</label><input id="fTags" placeholder="#travel, #fashion"></div><div class="field full"><label>Profile picture</label><input id="fAvatar" type="file" accept="image/*"></div></div><div class="editor-section"><h3>Highlights</h3><div id="highlightEditor"></div><button class="btn" id="addHighlight">+ Add highlight</button></div><div class="modal-actions"><button class="btn" id="closeEditor">Cancel</button><button class="btn primary" id="saveProfile">Save</button></div></div></div>
<div id="postPanel" class="panel"><div class="modal"><h2 id="postEditorTitle">New post</h2><div class="form-grid"><div class="field full"><label>Image</label><input id="pImage" type="file" accept="image/*"></div><div class="field full"><label>Caption</label><textarea id="pCaption"></textarea></div><div class="field"><label>Likes</label><input id="pLikes" type="number" min="0" value="0"></div><div class="field"><label>Comments</label><input id="pComments" type="number" min="0" value="0"></div></div><div class="modal-actions"><button class="btn" id="closePost">Cancel</button><button class="btn primary" id="savePost">Save post</button></div></div></div>
<div id="viewPanel" class="panel"><div class="modal post-view"><div id="viewContent"></div><div class="modal-actions"><button class="btn" id="closeView">Close</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const DB_NAME='krati-offline-db',DB_VERSION=1,STORE='app';
const defaultData={profile:{username:'your.username',name:'Your Name',bio:'Create your offline profile here.',followers:0,following:0,tags:['#creator','#offline'],avatar:''},highlights:[],posts:[]};
let data=structuredClone(defaultData),editingPostId=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get('data');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function dbSet(value){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(value,'data');r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
async function save(){await dbSet(data);render()}
function render(){const p=data.profile;document.getElementById('username').textContent='@'+p.username;document.getElementById('name').textContent=p.name;document.getElementById('bio').textContent=p.bio;document.getElementById('followers').textContent=p.followers;document.getElementById('following').textContent=p.following;document.getElementById('postsCount').textContent=data.posts.length;document.getElementById('avatar').src=p.avatar||placeholder('👤');document.getElementById('tags').innerHTML=p.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('');document.getElementById('highlights').innerHTML=data.highlights.length?data.highlights.map(h=>`<div class="highlight"><img src="${h.image||placeholder('★')}" alt=""><span>${esc(h.name)}</span></div>`).join(''):'<div class="empty" style="padding:20px 0;width:100%">No highlights yet</div>';const grid=document.getElementById('grid');grid.innerHTML=data.posts.length?data.posts.map((x,i)=>`<article class="post-tile" data-id="${x.id}"><img src="${x.image}" alt="Post ${i+1}"><div class="tile-info">♡ ${x.likes||0} &nbsp; ♡ ${x.comments||0}</div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">No posts yet. Tap + Post to add one.</div>';document.querySelectorAll('.post-tile').forEach(e=>e.onclick=()=>openView(e.dataset.id))}
function placeholder(text){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#eee"/><text x="50%" y="54%" text-anchor="middle" font-size="90">${text}</text></svg>`)}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res('');const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function openEditor(){const p=data.profile;fUsername.value=p.username;fName.value=p.name;fBio.value=p.bio;fFollowers.value=p.followers;fFollowing.value=p.following;fTags.value=p.tags.join(', ');fAvatar.value='';renderHighlightEditor();editorPanel.classList.add('open')}
function renderHighlightEditor(){highlightEditor.innerHTML=data.highlights.map((h,i)=>`<div class="list-row"><div class="row-main"><img src="${h.image||placeholder('★')}"><div class="row-text"><b>${esc(h.name)}</b><span>Highlight ${i+1}</span></div></div><button class="btn danger" onclick="removeHighlight(${i})">Delete</button></div>`).join('')}
window.removeHighlight=async i=>{data.highlights.splice(i,1);await save();renderHighlightEditor()};
addHighlight.onclick=async()=>{const name=prompt('Highlight name');if(!name)return;const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{const image=await fileData(input.files[0]);data.highlights.push({id:crypto.randomUUID(),name,image});await save();renderHighlightEditor()};input.click()};
saveProfile.onclick=async()=>{data.profile.username=fUsername.value.trim()||'username';data.profile.name=fName.value.trim()||'Your Name';data.profile.bio=fBio.value;data.profile.followers=Math.max(0,Number(fFollowers.value)||0);data.profile.following=Math.max(0,Number(fFollowing.value)||0);data.profile.tags=fTags.value.split(',').map(x=>x.trim()).filter(Boolean);const img=await fileData(fAvatar.files[0]);if(img)data.profile.avatar=img;await save();editorPanel.classList.remove('open');toast('Profile saved locally')};
function openPostEditor(id=null){editingPostId=id;const x=id?data.posts.find(p=>p.id===id):null;postEditorTitle.textContent=x?'Edit post':'New post';pCaption.value=x?.caption||'';pLikes.value=x?.likes||0;pComments.value=x?.comments||0;pImage.value='';postPanel.classList.add('open')}
savePost.onclick=async()=>{const img=await fileData(pImage.files[0]);if(editingPostId){const x=data.posts.find(p=>p.id===editingPostId);if(img)x.image=img;x.caption=pCaption.value;x.likes=Math.max(0,Number(pLikes.value)||0);x.comments=Math.max(0,Number(pComments.value)||0)}else{if(!img){toast('Please choose an image');return}data.posts.unshift({id:crypto.randomUUID(),image:img,caption:pCaption.value,likes:Math.max(0,Number(pLikes.value)||0),comments:Math.max(0,Number(pComments.value)||0),createdAt:Date.now()})}await save();postPanel.classList.remove('open');toast('Post saved locally')};
function openView(id){const x=data.posts.find(p=>p.id===id);if(!x)return;viewContent.innerHTML=`<img src="${x.image}" alt=""><div class="post-copy"><h3>♡ ${x.likes||0} likes &nbsp; · &nbsp; ${x.comments||0} comments</h3><p>${esc(x.caption)}</p><div class="muted">Saved on this device</div><div class="modal-actions"><button class="btn" onclick="openPostEditor('${x.id}');viewPanel.classList.remove('open')">Edit</button><button class="btn danger" onclick="deletePost('${x.id}')">Delete</button></div></div>`;viewPanel.classList.add('open')}
window.deletePost=async id=>{if(!confirm('Delete this post?'))return;data.posts=data.posts.filter(p=>p.id!==id);await save();viewPanel.classList.remove('open');toast('Post deleted')};
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
exportBtn.onclick=()=>{const backup={format:'krati-offline-backup',version:1,exportedAt:new Date().toISOString(),data};download('krati-backup.json',JSON.stringify(backup)) ;toast('Backup exported')};
importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{const file=importFile.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.format!=='krati-offline-backup'||!parsed.data)throw Error('Invalid backup');data=parsed.data;await save();toast('Backup restored successfully')}catch(e){alert('Could not import this backup file.')}};
editBtn.onclick=openEditor;profileEditBtn.onclick=openEditor;addPostBtn.onclick=()=>openPostEditor();closeEditor.onclick=()=>editorPanel.classList.remove('open');closePost.onclick=()=>postPanel.classList.remove('open');closeView.onclick=()=>viewPanel.classList.remove('open');
(async()=>{const saved=await dbGet();if(saved)data=saved;render()})();
</script>
</body>
</html>
